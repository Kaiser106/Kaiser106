name: Generate arcade animation

on:
  schedule:
    # Her 12 saatte bir, tam saat başında çalışır
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # İlk README şablonunda hem Galaga hem de Pacman vardı. 
          # İkisini birden üretmek istersen burayı 'pacman, galaga' olarak değiştirebilirsin.
          games: 'galaga' 

      - name: push galaga-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
